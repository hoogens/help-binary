<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help, Binary</title>

    <style>
    * {
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    body {
        margin: 0
    }

    .header {
        padding: 20px;
        text-align: left;
        font-size: 20px;
        color: #FFFFFF;
        background-color: #0B3954;
        margin: 0;
    }

    ul {

        padding: 20px;

        border-color: #0B3954;
        background-color: #FFFFFF;

        border-radius: 20px;
    }

    input[type=text] {
        width: 80%;
        padding: 10px;
        margin-bottom: 10px;

</head>

<body>

    </div>
