<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help, Binary - Learn Binary Calculation</title>
    <meta name="description" content="Practice binary calculations: convert binary to decimal. Free and interactive.">

    <style>
    * {
        box-sizing: border-box;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    html {
        height: 100%;
    }

    body {
        margin: 0;

        min-height: 100%;

        display: flex;
        flex-direction: column;

        font-size: 16px;
    }

    .header {
        padding: 20px;
        text-align: left;
        font-size: 20px;
        color: #FFFFFF;
        background-color: #0B3954;
        margin: 0;
    }

    ul {
        list-style-type: none;
        padding: 0;
    }

    .toc {
        border-style: none;
        color: #0B3954;
        background-color: #E6EEF3;
        padding: 10px;
    }

    .content {
        max-width: 500px;
        width: 90%;
        margin: auto;
        padding: 20px;

        border-style: solid;
        color: #1A1A1A;
        border-color: #0B3954;
        background-color: #FFFFFF;
        font-size: 16px;

        border-radius: 20px;
    }

    #bin-txt {
        font-family: monospace;
        font-size: 18px;
    }

    input[type=text] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 16px;
    }

    input[type=submit] {
        padding: 15px;
        color: #FFFFFF;
        background-color: #0B3954;
        border-radius: 5px;
        font-size: 16px;

    }

    footer {
        color: #FFFFFF;
        background-color: #0B3954;
        font-size: 14px;

        padding: 10px;
        margin-top: auto;
    }

    footer a {
        color: #FFFFFF;
    }


    </style>
</head>

<body>
    <div class="header">
        <h1 id="title">Help, Binary!</h1>
    </div>

    <div class="toc">
        <ul>
            <li>Binary to Number</li>
        </ul>
    </div>

    <div class="content">
        <!-- Exercise question -->
        <p>What is <span id="bin-txt"></span>: </p>

        <!-- Form module -->
        <form id="form" name="form">
            <label for="quest-txt">Answer: </label>
            <input type="text" id="quest-txt" name="quest-txt" placeholder="Enter your answer"><br>
            <input type="submit" id="quest-btn" name="quest-btn">
        </form>

        <!-- Feedback element -->
         <p>Your answer is <span id="feedback_answer"></span></p>
    </div>
    
    <footer>
        <p>AMS Software - KvK: 93031688 - <a href="mailto:contact@ams-software.com">Send Email</a></p>
    </footer>
    

    <!----------------------------------------------------->
    <script>
        let decNum;

        function getRandomInt(max){
            return Math.floor(Math.random() * max + 1);
        }

        function decimalToBinary(decimalNumber){
            return decimalNumber.toString(2)
        }

        function question_feedback(quest_answer){
            if (Number(quest_answer) === decNum) {
                document.getElementById('feedback_answer').textContent = 'Correct'
            }
            else {
                document.getElementById('feedback_answer').textContent = 'Not correct'
            }
        }

        function new_question(){
            // Exercise number in decimal
            decNum = getRandomInt(15);

            // Convert exercise number to binary
            let binNum = decimalToBinary(decNum);

            // Inserts the binary number as question text
            document.getElementById('bin-txt').textContent = binNum
        }

        function user_answer(e){
            e.preventDefault();

            // Users answer
            let quest_answer = document.getElementById('quest-txt').value;
                    
            question_feedback(quest_answer)
            new_question()

            document.getElementById('quest-txt').value = '';
        }

        document.getElementById('form').addEventListener('submit', user_answer)
        new_question()

    </script>  
</body> 
</html>
