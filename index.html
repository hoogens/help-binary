<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help, Binary</title>

    <style>
    .header {
        width: 100%;
        padding: 20px;
        text-align: left;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 20px;
        color: darkslategrey;
        background-color: lightblue;
        margin: 0;
    }

    ul {
        list-style-type: none;
        padding: 0;
    }

    .toc {
        width: 100%;
        border-style: solid;
        background-color: grey;
        padding-left: 20px;
    }

    .content {
        max-width: 500px;
        margin: auto;
        padding: 20px;

        border-style: solid;
        border-color: lightgray;
        background-color: beige;

        border-radius: 20px;
    }

    input[type=text] {
        width: 80%;
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    </style>
</head>

<body>
    <div class="header">
        <h1 id="aa">Help, Binary!</h1>
    </div>
    <div class="toc">
        <ul>
            <li>Binary to Number</li>
        </ul>
    </div>
    <div class="content">
        <p>What is 1101: </p>
        <form name="form">
            <label for="quest-txt">Answer: </label>
            <input type="text" id="quest-txt" name="quest-txt" placeholder="Enter your answer"><br>
            <input type="submit" id="quest-btn" name="quest-btn">
        </form>
    </div>

    <script>
        form.addEventListener('submit', e => {
            let quest_txt = document.getElementById('quest-txt').value;
            
            e.preventDefault();
            
            console.log(quest_txt);
        });

    </script>  
</body> 
</html>
