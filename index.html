<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help, Binary</title>

    <style>
    .header {
        width: 100%;
        padding: 20px;
        text-align: left;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 20px;
        color: #FFFFFF;
        background-color: #0B3954;
        margin: 0;
    }

    ul {
        list-style-type: none;
        padding: 0;
    }

    .toc {
        width: 100%;
        border-style: none;
        color: #0B3954;
        background-color: #E6EEF3;
        padding: 10px;
    }

    .content {
        max-width: 500px;
        margin: auto;
        padding: 20px;

        border-style: solid;
        color: #1A1A1A;
        border-color: #0B3954;
        background-color: #FFFFFF;

        border-radius: 20px;
    }

    input[type=text] {
        width: 80%;
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    input[type=submit] {
        padding: 10px;
        color: #FFFFFF;
        background-color: #0B3954;
        border-radius: 10%;
    }

    </style>
</head>

<body>
    <div class="header">
        <h1 id="aa">Help, Binary!</h1>
    </div>

    <div class="toc">
        <ul>
            <li>Binary to Number</li>
        </ul>
    </div>

    <div class="content">
        <!-- Exercise question -->
        <p>What is <span id="bin-txt"></span>: </p>

        <!-- Form module -->
        <form id="form" name="form">
            <label for="quest-txt">Answer: </label>
            <input type="text" id="quest-txt" name="quest-txt" placeholder="Enter your answer"><br>
            <input type="submit" id="quest-btn" name="quest-btn">
        </form>

        <!-- Feedback element -->
         <p>Your answer is <span id="feedback_answer"></span></p>
    </div>

    <script>
        function getRandomInt(max){
            return Math.floor(Math.random() * max + 1);
        }

        function decimalToBinary(decimalNumber){
            return decimalNumber.toString(2)
        }
        
        // Exercise number in decimal
        let decNum = getRandomInt(15);
        // Convert exercise number to binary
        let binNum = decimalToBinary(decNum);

        // Inserts the binary number as question text
        document.getElementById('bin-txt').textContent = binNum
        console.log(decNum)
        let quest_answer

        document.getElementById('form').addEventListener('submit', user_answer)

        function user_answer(e, quest_answer){
            e.preventDefault();

            // Users answer
            quest_answer = document.getElementById('quest-txt').value;
                    
            console.log(quest_answer);

            if (Number(quest_answer) === decNum) {
                console.log('Correct')
                document.getElementById('feedback_answer').textContent = 'Correct'
            }
            else {
                console.log('Error')
                document.getElementById('feedback_answer').textContent = 'Not correct'
            }
        }
        

    </script>  
</body> 
</html>
